[package]
name = "scry"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
xcap = "0.9.7"
anyhow = "1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde_json = "1.0.151"
base64 = "0.23.0"
confy = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
ocrs = "0.12.2"
rten = "0.24"
image = "0.25.10"

# profiles last, always
[profile.dev.package."*"]
opt-level = 3